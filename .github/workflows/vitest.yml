name: Vitest Unit Tests
on:
  push:
    branches: [main, sprints]
  pull_request:
    branches: [sprints]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PUBLIC_FIREBASE_API_KEY: 'AIzaSyDZOt8khx1of7rcJ5PNU0RxNUCuRxAr0dU'
      PUBLIC_FIREBASE_AUTH_DOMAIN: 'one10-2f14b.firebaseapp.com'
      PUBLIC_FIREBASE_PROJECT_ID: 'one10-2f14b'
      PUBLIC_FIREBASE_STORAGE_BUCKET: 'one10-2f14b.appspot.com'
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '895328691932'
      PUBLIC_FIREBASE_APP_ID: '1:895328691932:web:cc16c01f4c055f34437619'
      PUBLIC_FIREBASE_MEASUREMENT_ID: 'G-41H7ML4E6P'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest unit tests
        run: npm run test:unit -- --run
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore
